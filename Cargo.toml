[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AhmiDarrow/RemedyLua"
authors = ["Ahmi Darrow"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
overflow-checks = false

# Tests run optimized (fast) with line tables only (fast links).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package.remedy-lua]
opt-level = 2
