name: SEC7-G2 independent latency check
on:
  push:
    branches: [validation/sec7-g2-latency]
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TZ: UTC
      CARGO_PROFILE_TEST_CODEGEN_UNITS: 1
    steps:
      - name: Prepare pinned compiler, Lua oracle and source revisions
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal
          curl -fsSLo lua.tar.gz https://www.lua.org/ftp/lua-5.4.7.tar.gz
          echo '9fbf5e28ef86c69858f6d3d34eccc32e911c1a28b4120ff3e84aaa70cfbf1e30  lua.tar.gz' | sha256sum -c -
          tar xf lua.tar.gz
          echo "LUA_SRC=$PWD/lua-5.4.7/src" >> "$GITHUB_ENV"
          git clone --quiet "https://github.com/$GITHUB_REPOSITORY.git" sources
          git -C sources worktree add --detach ../baseline 9d515e2cff1483a66511cc66a5130c0dc60b0fae
          git -C sources worktree add --detach ../candidate a213f9bd40c8faa49bde39ae657c7179e5d8c80d
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = 52cbdb8b10746c58285ae77f4e24d97a57b34f6e
      - name: Build both test executables before measuring
        shell: bash
        run: |
          set -euo pipefail
          for variant in baseline candidate; do
            (cd "$variant" && cargo +1.96.0 test --locked -p remedy-lua --test all --no-run)
          done
      - name: Run the unchanged timing gate three times per revision
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          for trial in 1 2 3; do
            for variant in baseline candidate; do
              for name in residuals::res_table_resize_resumes_in_1ms_slices sweep3_sec::lr29_huge_replacements_and_joins_stop_promptly sweep6::s6gc_2e_a_big_table_is_marked_a_chunk_a_step sweep6::s6gc_2e_the_atomic_phase_stops_at_the_fuel_limit sweep6::sec7_g1_growth_report sweep6_gcpart::s6gc_2e_a_step_does_no_more_than_the_call_pays_for; do
                if (cd "$variant" && cargo +1.96.0 test --locked -p remedy-lua --test all -- --exact --test-threads=1 "$name"); then
                  result=PASS
                else
                  result=FAIL
                  if [[ "$variant" == candidate ]]; then failures=$((failures + 1)); fi
                fi
                echo "$variant trial $trial $name $result" >> "$GITHUB_STEP_SUMMARY"
              done
            done
          done
          test "$failures" = 0
