name: CI
# The gate's deterministic steps (tools/gate.sh ci) on every PR and push to main.
# T, Tn and S measure time or need a quiet machine: they stay local (docs/testing.md).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  RUSTUP_TOOLCHAIN: 1.96.0
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  gate:
    name: gate ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            steps: D Dn O L W
          - os: windows-2022
            steps: D
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Pinned compiler and the Lua 5.4.7 oracle sources
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          curl -fsSLo lua.tar.gz https://www.lua.org/ftp/lua-5.4.7.tar.gz
          echo '9fbf5e28ef86c69858f6d3d34eccc32e911c1a28b4120ff3e84aaa70cfbf1e30  lua.tar.gz' | sha256sum -c -
          # Extract from inside the target dir: GNU tar reads "D:\..." as host:path.
          mkdir -p "$RUNNER_TEMP/lua"
          mv lua.tar.gz "$RUNNER_TEMP/lua/"
          (cd "$RUNNER_TEMP/lua" && tar xzf lua.tar.gz && rm lua.tar.gz)
          test -f "$RUNNER_TEMP/lua/lua-5.4.7/src/lua.h"
          echo "LUA_SRC=$RUNNER_TEMP/lua/lua-5.4.7/src" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        if: contains(matrix.steps, 'W')
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tools/wasm-smoke
      - name: tools/gate.sh ci ${{ matrix.steps }}
        env:
          GATE_LOGS: target/gate/ci
        run: tools/gate.sh ci ${{ matrix.steps }}
      - name: Gate logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: gate-logs-${{ matrix.os }}
          path: target/gate/ci
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Pinned compiler and the Lua 5.4.7 oracle sources
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          curl -fsSLo lua.tar.gz https://www.lua.org/ftp/lua-5.4.7.tar.gz
          echo '9fbf5e28ef86c69858f6d3d34eccc32e911c1a28b4120ff3e84aaa70cfbf1e30  lua.tar.gz' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/lua"
          mv lua.tar.gz "$RUNNER_TEMP/lua/"
          (cd "$RUNNER_TEMP/lua" && tar xzf lua.tar.gz && rm lua.tar.gz)
          test -f "$RUNNER_TEMP/lua/lua-5.4.7/src/lua.h"
          echo "LUA_SRC=$RUNNER_TEMP/lua/lua-5.4.7/src" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      # Shipped code: every warning is an error.
      - name: cargo clippy (lib, bins)
        run: cargo clippy --workspace --lib --bins --locked -- -D warnings
      # Tests, examples, benches: the deny-level lints (Cargo.toml) hold everywhere;
      # style warnings in test code are reported, not fatal, for now.
      - name: cargo clippy (all targets, deny lints)
        run: cargo clippy --workspace --all-targets --locked
      # Optional features: not in the gate's default build.
      - name: cargo clippy + test (serde)
        run: |
          cargo clippy -p remedy-lua --lib --features serde --locked -- -D warnings
          cargo test -p remedy-lua --lib --features serde --locked
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p remedy-lua --no-deps --locked --features serde
